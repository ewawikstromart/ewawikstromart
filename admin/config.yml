backend:
  name: github
  repo: ewawikstromart/ewawikstromart
  branch: main
  base_url: https://sveltia-cms-auth.ewa-wikstrom123.workers.dev
# Inloggning via GitHub kräver OAuth-anslutning, eller tillfällig token-inloggning.
# Se START_HAR_ADMINISTRATION.txt innan publicering.
media_folder: images
public_folder: /images
locale: sv

collections:
  - name: innehall
    label: Mina texter och utställningar
    files:
      - name: site
        label: Webbplatsens texter
        file: data/site.json
        fields:
          - { label: Presentation på startsidan, name: intro, widget: text }
          - { label: Om mig, name: about, widget: text }
          - { label: E-post, name: email, widget: string }
          - { label: Instagram-länk, name: instagram, widget: string }
          - { label: Utställningar (en utställning per rad), name: exhibitions, widget: text, hint: 'Skriv till exempel: 2026 – Utställning, Galleri, Ort' }
  - name: malningar
    label: Mina målningar
    files:
      - name: verklista
        label: Lägg till och redigera målningar
        file: data/works.json
        fields:
          - label: Målningar (dra för att ändra ordning)
            name: items
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Bild – välj originalfoto, name: image, widget: image }
              - { label: Teknik, name: technique, widget: select, options: [Akvarell, Olja] }
              - { label: Mått, name: dimensions, widget: string, required: false }
              - { label: År, name: year, widget: string, required: false }
              - { label: Status, name: status, widget: select, options: ['Ej angivet', 'Till salu', 'Såld', 'Ej till salu'], default: 'Ej angivet' }
              - { label: Visa pris, name: show_price, widget: boolean, default: false }
              - { label: Pris i kronor (utan kr), name: price, widget: string, required: false }
              - { label: Visa som stor bild på startsidan, name: featured, widget: boolean, default: false }
